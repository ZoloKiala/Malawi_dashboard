<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server error | WASA Malawi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #F4F6F8;
        color: #1C2B3A;
        font-family: "Public Sans", Helvetica, Arial, sans-serif;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .error-card {
        max-width: 460px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #E8E7E7;
        border-radius: 12px;
        padding: 2.5rem 2rem;
        box-shadow: 0 4px 16px rgba(40, 83, 125, 0.1);
        text-align: center;
      }
      .error-eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 700;
        color: #5088C6;
        margin: 0 0 0.75rem;
      }
      .error-code {
        font-family: "DM Serif Text", Georgia, serif;
        font-size: 3.5rem;
        font-weight: 400;
        color: #E86933;
        margin: 0;
        line-height: 1;
      }
      .error-title {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0.85rem 0 0.4rem;
      }
      .error-message {
        color: #5B6B7A;
        font-size: 0.92rem;
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      .error-link {
        display: inline-block;
        background: #28537D;
        color: #ffffff;
        text-decoration: none;
        padding: 0.6rem 1.25rem;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.88rem;
        transition: background 0.15s ease;
      }
      .error-link:hover { background: #1F4266; }
    </style>
  </head>
  <body>
    <main class="error-card">
      <p class="error-eyebrow">WASA Malawi baseline</p>
      <p class="error-code">500</p>
      <h1 class="error-title">Something went wrong</h1>
      <p class="error-message">An unexpected error occurred on our side. Please try again in a moment. If the problem persists, get in touch with the dashboard maintainer.</p>
      <a class="error-link" href="/">Back to overview</a>
    </main>
  </body>
</html>
